name: Dependency Security Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "apps/api/package.json"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Capture complete dependency audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_exit=$?
          set -e
          echo "npm_audit_exit=$audit_exit" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};
          const total = counts.total ?? 0;
          const lines = [
            "## Dependency audit",
            "",
            "| Severity | Count |",
            "|---|---:|",
            ...["critical", "high", "moderate", "low", "info"].map(
              (severity) => `|${severity}|${counts[severity] ?? 0}|`
            ),
            `|**Total**|**${total}**|`,
            "",
            "### Vulnerable packages",
            "",
          ];
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            lines.push(
              `- **${name}** — ${item.severity}; direct: ${item.isDirect}; range: ${item.range}; fix available: ${JSON.stringify(item.fixAvailable)}`
            );
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          console.log(lines.join("\n"));
          NODE

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-evidence
          path: |
            apps/web/npm-audit.json
            apps/web/package-lock.json
          if-no-files-found: warn

  audit-api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile and audit API dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          retention-days: 14
